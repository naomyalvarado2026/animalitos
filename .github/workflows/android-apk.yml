name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la Release (ej. android-v1.1.0)'
        required: true
        default: 'android-v1.1.0'
        type: string
      version_name:
        description: 'Versión visible de la app (ej. 1.1.0)'
        required: true
        default: '1.1.0'
        type: string
      version_code:
        description: 'Código numérico incremental (ej. 2)'
        required: true
        default: '2'
        type: string
      publish_release:
        description: 'Publicar en GitHub Releases como última versión'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'android-v*'
    branches:
      - 'release/android-v*'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/sync-android-offline-bundle.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run android:sync-bundle
        env:
          VITE_SUPABASE_URL: https://uxktqlmffongcagaxgtr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_S5TIxJBh496EsYvNyyV1-Q_2B6JT8qr
          VITE_SITE_ORIGIN: https://naomyalvarado2026.github.io

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK on Pull Request
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: adoptame-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Validate release signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Faltan secretos de firma Android (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/adoptame-release.jks"

      - name: Resolve version metadata
        id: meta
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            VNAME="${{ inputs.version_name }}"
            VCODE="${{ inputs.version_code }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              TAG="${TAG#release/}"
            fi
            VNAME="${TAG#android-v}"
            VCODE="${{ github.run_number }}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/adoptame-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName="${{ steps.meta.outputs.version_name }}" \
            -PappVersionCode="${{ steps.meta.outputs.version_code }}" \
            --no-daemon

      - name: Verify APK signature and generate SHA-256
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/release-out"
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="$RUNNER_TEMP/release-out/AdoptaME-android.apk"
          cp "$APK_SRC" "$APK_DEST"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_DEST"
          (cd "$RUNNER_TEMP/release-out" && sha256sum AdoptaME-android.apk > AdoptaME-android.apk.sha256)

      - name: Upload Release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: adoptame-android-release
          path: ${{ runner.temp }}/release-out/AdoptaME-android.apk*
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VNAME: ${{ steps.meta.outputs.version_name }}
        run: |
          APK_FILE="$RUNNER_TEMP/release-out/AdoptaME-android.apk"
          SHA_FILE="$RUNNER_TEMP/release-out/AdoptaME-android.apk.sha256"
          NOTES="App oficial de AdoptaME para Android v${VNAME}. Descarga \`AdoptaME-android.apk\` en tu celular Android 7.0+ e instálalo directamente."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" "$SHA_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" "$SHA_FILE" \
              --title "AdoptaME Android v${VNAME}" \
              --notes "$NOTES" \
              --latest
          fi
