<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO -->
    <title>AdoptaME — Cada perro merece una historia feliz</title>
    <meta name="description" content="Conoce perros rescatados, adopta responsablemente y apoya su recuperación con AdoptaME." />
    <meta name="keywords" content="adopción perros, rescate perros, refugio canino, merchandising solidario" />

    <!-- Tipografía: Plus Jakarta Sans, sans serif moderna y cercana -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- SPA Redirect for GitHub Pages -->
    <script>
      (function() {
        var path = window.location.pathname;
        var base = '/animalitos';
        if (path.startsWith(base) && path.length > base.length && !window.location.hash) {
          var sub = path.substring(base.length);
          if (sub && sub !== '/' && sub !== '/index.html' && sub !== '/404.html') {
            window.location.replace(base + '/#' + sub + window.location.search);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
